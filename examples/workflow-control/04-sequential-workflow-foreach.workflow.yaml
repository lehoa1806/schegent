apiVersion: schegent/v1
kind: Workflow
metadata:
  id: example-sequential-workflow-foreach
  name: Sequential Child-Workflow ForEach Loop
  description: Demonstrates a parent Workflow invoking a child item-processing Workflow sequentially across a frozen JSON collection with ordered result/error slots.
  version: 1
spec:
  inputs:
    - portId: items-file
      label: Items Collection File
      type: local-file
      required: true
  outputs:
    - portId: batch-result-index
      label: Batch Result Index
      type: markdown
      required: false
  nodes:
    - nodeId: node-foreach-items
      kind: workflow
      workflowId: wf-child-item-processor
      label: Process Collection Items Sequentially
      control:
        version: 1
        kind: for-each
        collection:
          source: workflow-input
          portId: items-file
        itemKeyField: id
        itemInputPortId: item-payload
        maxItems: 50
        onItemError: continue
  bindings:
    - kind: output
      nodeId: node-foreach-items
      portId: batch-result-index
      outputKey: item-report
      type: markdown
  startNodeIds:
    - node-foreach-items
included:
  workflows:
    - metadata:
        id: wf-child-item-processor
        name: Child Item Processor Workflow
        version: 1
      spec:
        inputs:
          - portId: item-payload
            label: Item Payload JSON
            type: text
            required: true
        outputs:
          - portId: item-report
            label: Item Report
            type: markdown
            required: false
        nodes:
          - nodeId: node-process-item
            kind: phase
            phaseId: phase-process-single-item
            label: Process Single Item
        bindings:
          - kind: input
            nodeId: node-process-item
            inputKey: payload
            type: text
            required: true
            source:
              from: workflow-input
              portId: item-payload
          - kind: output
            nodeId: node-process-item
            portId: item-report
            outputKey: report
            type: markdown
        startNodeIds:
          - node-process-item
  phases:
    - metadata:
        phaseId: phase-process-single-item
        name: Process Single Item
        version: 1
      spec:
        runner: codex
        instruction: Process the single canonical JSON item bound to payload and write an item report.
