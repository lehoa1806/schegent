apiVersion: schegent/v1
kind: Pipeline
metadata:
  id: speckit-new-feature
  name: Spec-kit New Feature
  version: 4
spec:
  phaseIds:
    - speckit-specify
    - speckit-clarify
    - speckit-plan
    - speckit-tasks
    - speckit-checklist
    - speckit-analyze
    - speckit-implement
    - speckit-code-review
    - speckit-security-review
    - finalize
included:
  phases:
    - metadata:
        phaseId: speckit-specify
        name: Spec-kit Specify
        version: 1
      spec:
        instruction: /speckit-specify
        runner: claude
        # FR-R3-117 — stated explicitly, though it is now also the default for any
        # Phase whose sideEffects is other than `none`. Written out because this
        # example is what an operator copies: a Phase making a verifiable claim
        # should say what judges it, not inherit it silently.
        hostVerification: exit-code
        sideEffects: git
        model: claude-opus-5-5
        effort: high
    - metadata:
        phaseId: speckit-clarify
        name: Spec-kit Clarify
        version: 2
      spec:
        instruction: |-
          Run /speckit-clarify on the active feature spec.

          NON-SKIPPABLE: You MUST actually invoke /speckit-clarify — never infer "no ambiguities" without an executed run. A "clean" result is valid ONLY when it comes from a real /speckit-clarify Completion Report.

          Auto-accept mode: For every question, accept the recommended/suggested answer automatically:
          - For multiple-choice with "Recommended: Option [X]" → respond with that option letter or "recommended".
          - For short-answer with "Suggested:" → respond with "suggested".
          - Process ALL questions in the iteration without pausing. Do NOT ask the user.

          Evidence gate: The iteration counts only if /speckit-clarify actually ran and produced evidence — EITHER a Completion Report with a coverage summary table, OR the explicit "No critical ambiguities detected" message.

          Result determination (from the actual run output only):
          - If "No critical ambiguities detected" AND no questions asked → emit [SCHEGENT_STATUS: CLEAR]
          - If all coverage categories are Clear AND no questions asked → emit [SCHEGENT_STATUS: CLEAR]
          - If ANY questions were asked and auto-accepted → emit "Open questions:" followed by a summary of them and the answers accepted. That summary is a record of what this iteration decided; it does NOT ask for another iteration. Whether the phase loops is determined solely by the `open_questions` metric below, which is zero when every question asked was answered.

          Inside the SCHEGENT AUDIT LOG block, emit `open_questions: <N>` and `resolved_questions: <N>` as top-level integer metric lines so the controller can observe progress. `open_questions` is the count of questions still unanswered AFTER this iteration's auto-accept pass — zero whenever every question asked this iteration was answered, never the count of questions asked. `resolved_questions` is the count of questions answered during this iteration.
        model: claude-opus-5-5
        effort: high
        retryCondition: open_questions > 0
    - metadata:
        phaseId: speckit-plan
        name: Spec-kit Plan
        version: 1
      spec:
        instruction: /speckit-plan
        model: claude-opus-5-5
        hostVerification: exit-code
        effort: xhigh
    - metadata:
        phaseId: speckit-tasks
        name: Spec-kit Tasks
        version: 3
      spec:
        instruction: |-
          Run /speckit-tasks on the active feature.

          Then mark hand-off tasks in <feature_dir>/tasks.md. Implement sets a marked task aside instead of attempting it, so a mark takes the task out of implement's loop:
          - Add the label [USER-RUN], beside the task's other labels, to a task only when it needs a person: pushing, opening or merging a pull request, watching CI, deploying to a system outside this repository, an explicit approval, or work that cannot start until one of those has happened.
          - Never mark work the authorized headless run can complete. Difficulty, size and a failing test are not reasons to mark a task.
          - When one task line combines headless work with a person-only step, split it in two: the headless work stays an unmarked task, and the person-only step becomes its own marked task.
          - Mark only the tasks /speckit-tasks wrote and the person-only half of a line you split. Never add a person-only task the generated list does not have.
          - A task that only mentions the label, for example to describe it, writes it in inline code, as `USER-RUN`, and is not marked.
        model: claude-opus-5-5
        hostVerification: exit-code
        effort: high
    - metadata:
        phaseId: speckit-checklist
        name: Spec-kit Checklist
        version: 2
      spec:
        instruction: |-
          Run /speckit-checklist on the active feature.

          Auto-select: Depth=Standard, Audience=Reviewer, Focus=Top 2 relevance clusters. For all clarifying questions, choose the most comprehensive option automatically.

          Verify (soft — non-blocking): Confirm the run produced a checklist under <feature_dir>/checklists/. If missing, note the warning but proceed.

          Always emit [SCHEGENT_STATUS: CLEAR] when complete — checklist is non-blocking.

          Inside the SCHEGENT AUDIT LOG block, emit `checklist_items: <N>` as a top-level integer metric line.
        model: claude-sonnet-5-5
        effort: medium
    - metadata:
        phaseId: speckit-analyze
        name: Spec-kit Analyze
        version: 2
      spec:
        instruction: |-
          Run /speckit-analyze on the active feature.

          NON-SKIPPABLE: You MUST actually invoke /speckit-analyze at least once — never assume "0 CRITICAL issues" without an executed run. /speckit-analyze is READ-ONLY (writes no files), so a skipped run leaves NO artifact trace. A "clean" result is valid ONLY when it comes from a real Specification Analysis Report whose Metrics block reports Critical Issues Count: 0.

          Evidence gate: The iteration counts only if /speckit-analyze actually ran and produced a Specification Analysis Report with its findings table and Metrics block (Total Requirements, Total Tasks, Coverage %, Critical Issues Count).

          Result determination (from the actual report only):
          - If 0 CRITICAL issues AND no remediation performed → emit [SCHEGENT_STATUS: CLEAR]
          - If CRITICAL issues exist → apply auto-remediation (see below), then emit "Remaining issues:" listing unresolved criticals

          Start each bullet under "Remaining issues:" with one tag in square brackets, chosen from:
          - [regression] the change made by this work broke something that worked before.
          - [pre-existing] the problem was already there before this work, and this work did not cause it.
          - [environment] a tool, service, network, credential or machine problem outside the code.
          - [needs-approval] an action only a maintainer may approve, such as a dependency bump or a waiver.
          - [needs-decision] a choice between options that someone must make before the work can continue.
          If no tag fits, write the bullet without a tag. A tag describes the issue; it does not change what happens next.

          Auto-remediation (when issues exist):
          - Respond "Yes, suggest and apply remediation for ALL issues including HIGH severity."
          - Apply ALL suggested edits to spec.md, plan.md, and/or tasks.md.
          - Do NOT assume remediation fixed everything — the controller will re-loop to verify.

          REQUIRED METRIC OUTPUT: Inside the SCHEGENT AUDIT LOG block, you MUST emit `critical_issues: <N>` and `high_issues: <N>` as top-level integer metric lines (NOT nested under Notes:, Findings:, or any other heading). These lines MUST appear even when the count is 0. Example:
          critical_issues: 0
          high_issues: 2
          The controller uses these metrics to decide whether to re-loop. Missing metrics cause incorrect advancement.
        model: claude-opus-5-5
        effort: xhigh
        retryCondition: critical_issues > 0
    - metadata:
        phaseId: speckit-implement
        name: Spec-kit Implement
        version: 4
      spec:
        instruction: |-
          Run /speckit-implement on the active feature.

          Nobody can answer a question during this Phase. Never ask the user anything and never stop to wait for an answer: settle it under "Decision authority" below, or set the task aside as blocked.

          Then close what it left open:
          1. Load <feature_dir>/tasks.md and list every task not marked complete.
          2. Set aside what you must not attempt: each hand-off task, defined under "Hand-off tasks" below, and each blocked task, defined under "Blocked tasks" below. Every other incomplete task is a pending task.
          3. Read <feature_dir>/spec.md and <feature_dir>/plan.md and cross-check the implementation against them. A spec gap is a requirement in spec.md, or a design decision in plan.md, that no code implements; name each by its requirement id or a short quote.
          4. Implement every pending task and every spec gap, and mark each finished task complete in tasks.md.

          Do not run a code review or a security review here, and do not spawn reviewer sub-agents: the next two Phases review this work.

          Hand-off tasks. A hand-off task is an incomplete task only a person can finish. A task is one only in these three cases, and the case is its basis:
          - marker: its own line in tasks.md carries the token USER-RUN outside inline code. A line that only quotes the token in inline code is not marked.
          - approval: its own line names a person's approval as the condition for the task, such as "once the user approves" or "after maintainer approval". Review, test results and other conditions do not count.
          - person-only last step: every other step of the task is done, and its only remaining step is pushing, opening or merging a pull request, watching CI, or deploying to a system outside this repository. A task with any implementation step still undone is pending, even when its line also names such a step.
          Difficulty, size and a failing test you can fix never make a task a hand-off. Do not attempt a hand-off task, do not mark it complete, and do not add, remove or edit any marker or approval wording on any task line.

          Decision authority. When a task is unclear, contradictory, or needs a choice no artifact states, settle it yourself instead of escalating it:
          - Precedence: the constitution (.specify/memory/constitution.md), then spec.md, then plan.md, then research.md, data-model.md and contracts/, then tasks.md. Follow the higher source and correct the lower one, or the code, to agree with it. Where every source is silent, take the conventional, lowest-risk option.
          - Project rules outrank this authority: the constitution, AGENTS.md, CLAUDE.md and the standing rules in tasks.md. Where one forbids an action, you do not have it.
          - Decide alone only a choice that is reversible inside this repository and touches no secret or credential, no system outside this repository and no production data. Never weaken a security or privacy property, edit the constitution, delete or reinterpret a requirement in spec.md, or change the expected outcome of a test that already exists on develop.
          - Record every decision in <feature_dir>/decisions.md as an entry headed "## D-<n>: <title>" with the lines "Status: decided", "Question:" (quote both sides), "Chosen:" (the option and the rule that settled it), "Reversal:" (what to change if a maintainer disagrees) and "Tasks:" (the task ids).

          Blocked tasks. A task is blocked when, after the above, the answer still needs a maintainer: two sources of equal rank conflict, the choice is outside your authority, or the information is not in the repository. Difficulty, size and a failing test you can fix are not blockers. For each blocked task:
          - Add an entry to <feature_dir>/decisions.md with "Status: needs-maintainer", the question, the options, the option you recommend and the task ids it blocks. A task that depends on a blocked task is blocked too.
          - Leave the task unchecked in tasks.md and do not work around it. Do not attempt it again in a later iteration unless a decision now answers it; a task under "Unresolved from previous iteration:" that failed for the same cause is blocked as well.

          Result determination:
          - If 0 tasks are pending, 0 spec gaps remain and 0 tasks are blocked → emit [SCHEGENT_STATUS: CLEAR], even when hand-off tasks remain
          - Otherwise → emit "Remaining issues:" listing each pending task, each open spec gap, and each blocked task with its decision id and the question a maintainer must answer. Never list a hand-off task there.

          Start each bullet under "Remaining issues:" with one tag in square brackets, chosen from:
          - [regression] the change made by this work broke something that worked before.
          - [pre-existing] the problem was already there before this work, and this work did not cause it.
          - [environment] a tool, service, network, credential or machine problem outside the code.
          - [needs-approval] an action only a maintainer may approve, such as a dependency bump or a waiver.
          - [needs-decision] a choice between options that someone must make before the work can continue.
          If no tag fits, write the bullet without a tag. A tag describes the issue; it does not change what happens next.

          - In both cases, when at least one hand-off task is open, list each one under "Hand-off tasks (for the user):" as `- <task id> (<basis>): <task text>`, before the SCHEGENT AUDIT LOG block and outside it. With none open, omit that heading.
          - Emit the completion token only where the output contract says, on its own line after the audit log block. Never echo it in prose, in a list or in a quote.

          REQUIRED METRIC OUTPUT: Inside the SCHEGENT AUDIT LOG block, you MUST emit `pending_tasks: <N>`, `spec_gaps: <N>`, `blocked_tasks: <N>` and `user_run_tasks: <N>` as top-level integer metric lines (NOT nested under Notes: or any other heading). All four count what is still open AFTER this iteration's work, and `pending_tasks` excludes blocked and hand-off tasks. `user_run_tasks` equals the number of tasks listed under "Hand-off tasks (for the user):". These lines MUST appear even when the count is 0. The controller uses `pending_tasks` to decide whether to re-loop; the other three are recorded and do not re-loop this Phase.
        model: claude-sonnet-5-5
        hostVerification: exit-code
        effort: xhigh
        retryCondition: pending_tasks > 0
    - metadata:
        phaseId: speckit-code-review
        name: Spec-kit Code Review
        version: 2
      spec:
        instruction: |-
          Review this feature's code changes for correctness defects, and fix them.

          Scope:
          - If the workspace root contains both a repo/ subdirectory (with its own .git/) AND a specs/ directory, the code repository is repo/. Otherwise it is the workspace root. Log which.
          - In the code repository, review `git diff $(git merge-base HEAD develop)` — every committed and uncommitted change since the branch left develop, the branch finalize merges into — plus each untracked file listed by `git ls-files --others --exclude-standard`. Both commands are read-only: never stage a file to make it visible.
          - Spec Kit artifacts (specs/, .specify/) are out of scope.

          Reviewing:
          - Do the review yourself, in this session. Do not invoke /code-review, which only a user can launch, and do not delegate to a sub-agent, which would run on a model this Phase did not choose.
          - When SCHEGENT_ITERATION is 1, review the whole scope. On a later iteration, re-check each item under "Unresolved from previous iteration:" and the code the previous fixes touched, instead of repeating the full review.
          - Count a finding only when you can state a concrete failure: the inputs or state, and the wrong result, crash, data loss or broken contract they produce.
          - Style, naming, speculative and refactoring remarks go under Notes: and are not counted. A demonstrated false positive also goes under Notes:, with a one-line justification, and is not counted.

          Fixing:
          - Apply a minimal fix for every counted finding, inside the code repository. Do not refactor unrelated code.
          - Re-check each fix once.

          Result determination:
          - If no counted finding remains unresolved → emit [SCHEGENT_STATUS: CLEAR]
          - Otherwise → emit "Remaining issues:" with one bullet per unresolved finding: file, line and the failure

          Start each bullet under "Remaining issues:" with one tag in square brackets, chosen from:
          - [regression] the change made by this work broke something that worked before.
          - [pre-existing] the problem was already there before this work, and this work did not cause it.
          - [environment] a tool, service, network, credential or machine problem outside the code.
          - [needs-approval] an action only a maintainer may approve, such as a dependency bump or a waiver.
          - [needs-decision] a choice between options that someone must make before the work can continue.
          If no tag fits, write the bullet without a tag. A tag describes the issue; it does not change what happens next.

          REQUIRED METRIC OUTPUT: Inside the SCHEGENT AUDIT LOG block, you MUST emit `code_review_findings: <N>` as a top-level integer metric line (NOT nested under Notes: or any other heading). It counts findings still unresolved AFTER this iteration's fixes. This line MUST appear even when the count is 0. The controller uses this metric to decide whether to re-loop.
        model: claude-opus-5-5
        hostVerification: exit-code
        effort: high
        retryCondition: code_review_findings > 0
    - metadata:
        phaseId: speckit-security-review
        name: Spec-kit Security Review
        version: 2
      spec:
        instruction: |-
          Review this feature's code changes for security defects, and fix them.

          Scope:
          - If the workspace root contains both a repo/ subdirectory (with its own .git/) AND a specs/ directory, the code repository is repo/. Otherwise it is the workspace root. Log which.
          - In the code repository, review `git diff $(git merge-base HEAD develop)` — every committed and uncommitted change since the branch left develop, the branch finalize merges into — plus each untracked file listed by `git ls-files --others --exclude-standard`. Both commands are read-only: never stage a file to make it visible.
          - Spec Kit artifacts (specs/, .specify/) are out of scope.

          Reviewing:
          - Do the review yourself, in this session. Do not delegate to a sub-agent, which would run on a model this Phase did not choose, and do not treat a /security-review skill's checklist as the review.
          - When SCHEGENT_ITERATION is 1, review the whole scope. On a later iteration, re-check each item under "Unresolved from previous iteration:" and the code the previous fixes touched, instead of repeating the full review.
          - Trace untrusted input (user input, files, network, environment, IPC) to where it is used. Check injection, path traversal, authentication and authorization, secrets in code or logs, unsafe deserialization, and unbounded resource use.
          - Count a finding only when you can state a concrete exploit or failure path: who controls the input, what it reaches, and what goes wrong.
          - A demonstrated false positive goes under Notes:, with a one-line justification of why the path is unreachable, and is not counted.

          Fixing:
          - Apply a minimal, targeted fix for every counted finding, inside the code repository. Do not refactor unrelated code, and do not undo the code review's fixes.
          - Re-check each fix once.

          Result determination:
          - If no counted finding remains unresolved → emit [SCHEGENT_STATUS: CLEAR]
          - Otherwise → emit "Remaining issues:" with one bullet per unresolved finding: file, line and the exploit or failure path

          Start each bullet under "Remaining issues:" with one tag in square brackets, chosen from:
          - [regression] the change made by this work broke something that worked before.
          - [pre-existing] the problem was already there before this work, and this work did not cause it.
          - [environment] a tool, service, network, credential or machine problem outside the code.
          - [needs-approval] an action only a maintainer may approve, such as a dependency bump or a waiver.
          - [needs-decision] a choice between options that someone must make before the work can continue.
          If no tag fits, write the bullet without a tag. A tag describes the issue; it does not change what happens next.

          REQUIRED METRIC OUTPUT: Inside the SCHEGENT AUDIT LOG block, you MUST emit `security_review_findings: <N>` as a top-level integer metric line (NOT nested under Notes: or any other heading). It counts findings still unresolved AFTER this iteration's fixes. This line MUST appear even when the count is 0. The controller uses this metric to decide whether to re-loop.
        model: claude-opus-5-5
        hostVerification: exit-code
        effort: high
        retryCondition: security_review_findings > 0
    - metadata:
        phaseId: finalize
        name: Finalize
        version: 4
      spec:
        instruction: |-
          Verify the implementation and drive it to green.

          Nobody can answer a question during this Phase, so never ask for approval and never stop to wait for an answer: act inside the authority below, or report what stopped you under "Remaining issues:".

          1. Format FIRST: Run the project formatter in write mode (e.g. cargo fmt, npm run format) exactly once before the check set.
          2. Run the full check set — build, tests, lint, typecheck. Capture pass/fail for each.
          3. If any check fails, classify each failure. A failure is caused by the feature unless you can show it is not, for example because it names only a dependency or a file that `git diff $(git merge-base HEAD develop)` does not touch.
             - Caused by the feature: diagnose root cause, apply a real fix, re-run affected checks, repeat until all green (max 10 iterations). Do NOT mask failures (no skipped tests, no eslint-disable, no loosened types, no weaker audit threshold or ignore list).
             - A dependency advisory the feature did not cause: fix it under step 6.
             - Any other failure the feature did not cause: re-run it once, then report it under "Remaining issues:" with the evidence that the feature did not cause it. Do not edit unrelated code to silence it.
          4. Standard fallbacks when plan.md lists no explicit commands:
             - Rust: cargo build, cargo test, cargo clippy -- -D warnings, cargo fmt --check
             - Node/TS: npm run build, npm test, npm run lint, npx tsc --noEmit
             - Python: test runner, ruff/flake8, mypy/pyright

          5. Commit all changes with conventional commit format: feat(<feature_name>): <summary>
          6. Dependency fixes. You are authorized to fix, without asking for approval, a failing dependency-audit check (npm audit, cargo audit, pip-audit or the project's equivalent) whose advisory is in a dependency the feature did not add or change. Clearing a failing check is part of this Phase's task, so a rule that keeps lockfile changes inside the requested task does not stop you; a rule that forbids dependency changes outright does, and then you report the advisory instead. Stay inside these limits:
             - Move the package to the lowest version the advisory names as fixed, or the nearest your tool resolves above it, by patch or minor versions only, with a targeted command that does not force (for example `npm update <package>`, `cargo update -p <package>`, `uv lock --upgrade-package <package>`).
             - Change at most three packages in all, and commit the change on its own, after the feature commit: fix(deps): clear <advisory ids> in <packages>
             - Then re-run the FULL check set. If a check that was green before the change now fails, undo the commit with git revert and report the advisory under "Remaining issues:".
             - Outside your authority, so report it under "Remaining issues:" with the advisory id, the package, its installed and fixed versions, and the limit that stopped you: a major version bump; adding, removing or replacing a dependency; an overrides, resolutions or constraints entry; a forced or blanket update, such as `npm audit fix`, which applies every fixable advisory in the tree at once; any change to the audit command, its threshold, its ignore list or a waiver, or to CI configuration; an advisory with no fixed version.
          7. Merge to local develop branch: git switch develop && git merge --no-ff <feature_branch>, but only if every check is green and <feature_dir>/decisions.md has no entry with "Status: needs-maintainer". Otherwise stop after the commits and say why under "Remaining issues:".

          Result determination:
          - If all checks are green and the merge is done → emit [SCHEGENT_STATUS: CLEAR]
          - Otherwise (checks still failing after 10 iterations, a failure or advisory outside your authority, or the merge withheld) → emit "Remaining issues:" listing each

          Start each bullet under "Remaining issues:" with one tag in square brackets, chosen from:
          - [regression] the change made by this work broke something that worked before.
          - [pre-existing] the problem was already there before this work, and this work did not cause it.
          - [environment] a tool, service, network, credential or machine problem outside the code.
          - [needs-approval] an action only a maintainer may approve, such as a dependency bump or a waiver.
          - [needs-decision] a choice between options that someone must make before the work can continue.
          If no tag fits, write the bullet without a tag. A tag describes the issue; it does not change what happens next.

          After a dependency fix, list each package under "Dependency fixes applied:" as `<package> <from> -> <to> (<advisory id>)`.

          Inside the SCHEGENT AUDIT LOG block, emit `checks_passing: <N>` and `checks_failing: <N>` as top-level integer metric lines.
        runner: claude
        # FR-R3-117 — stated explicitly, though it is now also the default for any
        # Phase whose sideEffects is other than `none`. Written out because this
        # example is what an operator copies: a Phase making a verifiable claim
        # should say what judges it, not inherit it silently.
        hostVerification: exit-code
        sideEffects: git
        model: claude-sonnet-5-5
        effort: medium
