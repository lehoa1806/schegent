apiVersion: schegent/v1
kind: Workflow
metadata:
  id: speckit-new-feature
  name: Spec-kit New Feature
  version: 1
spec:
  startNodeIds:
    - claude-speckit-specify
  nodes:
    - nodeId: claude-speckit-specify
      kind: phase
      phaseId: claude-speckit-specify
    - nodeId: claude-speckit-clarify
      kind: phase
      phaseId: claude-speckit-clarify
    - nodeId: claude-speckit-plan
      kind: phase
      phaseId: claude-speckit-plan
    - nodeId: claude-speckit-tasks
      kind: phase
      phaseId: claude-speckit-tasks
    - nodeId: claude-speckit-checklist
      kind: phase
      phaseId: claude-speckit-checklist
    - nodeId: claude-speckit-analyze
      kind: phase
      phaseId: claude-speckit-analyze
    - nodeId: claude-speckit-implement
      kind: phase
      phaseId: claude-speckit-implement
    - nodeId: claude-speckit-converge
      kind: phase
      phaseId: claude-speckit-converge
    - nodeId: claude-code-review
      kind: phase
      phaseId: claude-code-review
    - nodeId: claude-security-review
      kind: phase
      phaseId: claude-security-review
    - nodeId: claude-finalize
      kind: phase
      phaseId: claude-finalize
  connections:
    - from:
        nodeId: claude-speckit-specify
      to:
        nodeId: claude-speckit-clarify
    - from:
        nodeId: claude-speckit-clarify
      to:
        nodeId: claude-speckit-plan
    - from:
        nodeId: claude-speckit-plan
      to:
        nodeId: claude-speckit-tasks
    - from:
        nodeId: claude-speckit-tasks
      to:
        nodeId: claude-speckit-checklist
    - from:
        nodeId: claude-speckit-checklist
      to:
        nodeId: claude-speckit-analyze
    - from:
        nodeId: claude-speckit-analyze
      to:
        nodeId: claude-speckit-implement
    - from:
        nodeId: claude-speckit-implement
      to:
        nodeId: claude-speckit-converge
    - from:
        nodeId: claude-speckit-converge
      to:
        nodeId: claude-code-review
    - from:
        nodeId: claude-code-review
      to:
        nodeId: claude-security-review
    - from:
        nodeId: claude-security-review
      to:
        nodeId: claude-finalize
included:
  phases:
    - metadata:
        phaseId: claude-speckit-specify
        name: Spec-kit Specify (Claude)
        version: 1
      spec:
        instruction: /speckit-specify
        runner: claude
        hostVerification: exit-code
        sideEffects: git
        model: claude-opus-5-5
        effort: high
    - metadata:
        phaseId: claude-speckit-clarify
        name: Spec-kit Clarify (Claude)
        version: 1
      spec:
        instruction: |-
          /speckit-clarify
          Apply reversible defaults within the feature's scope. Report questions that need a maintainer without waiting.
          Audit the top-level integers `open_questions: <N>` (still unanswered) and `resolved_questions: <N>` (answered this pass).

          If this prompt has no SCHEGENT_FEATURE_DIR line and supplies a sidecar path, write the single line `SCHEGENT_FEATURE_DIR=<dir>` to phase-message.env there. Use the feature directory relative to the workspace root and list that file in the audit log's files_created. Never write an absolute path or one with a `..` segment.
        runner: claude
        model: claude-opus-5-5
        effort: high
        retryCondition: open_questions > 0
    - metadata:
        phaseId: claude-speckit-plan
        name: Spec-kit Plan (Claude)
        version: 1
      spec:
        instruction: /speckit-plan
        runner: claude
        model: claude-opus-5-5
        hostVerification: exit-code
        effort: xhigh
    - metadata:
        phaseId: claude-speckit-tasks
        name: Spec-kit Tasks (Claude)
        version: 1
      spec:
        instruction: |-
          /speckit-tasks
          Mark hand-offs in the generated tasks.md.
          - Add the label [USER-RUN], beside the task's other labels, to a task only when it needs a person: pushing, opening or merging a pull request, watching CI, deploying to a system outside this repository, an explicit approval, or work that cannot start until one of those has happened.
          - Never mark work the authorized headless run can complete. If a task mixes both kinds, split it in two and mark only the person-only part.
          - Never add a person-only task the generated list does not have. Write mentions of the label in inline code, as `USER-RUN`.
        runner: claude
        model: claude-opus-5-5
        hostVerification: exit-code
        effort: high
    - metadata:
        phaseId: claude-speckit-checklist
        name: Spec-kit Checklist (Claude)
        version: 1
      spec:
        instruction: |-
          /speckit-checklist
          Generate a custom checklist only when the feature calls for one. Otherwise report the existing requirements checklist. Leave reviewer checkboxes unchanged and report unanswered questions without waiting.
          Audit `checklist_items: <N>` as a top-level integer (0 if no checklist exists).
        runner: claude
        model: claude-sonnet-5-5
        effort: medium
    - metadata:
        phaseId: claude-speckit-analyze
        name: Spec-kit Analyze (Claude)
        version: 1
      spec:
        instruction: |-
          /speckit-analyze
          After the read-only report, apply explicitly authorized artifact fixes and recheck. Report approval or decision blockers without waiting.
          List unresolved critical findings under "Remaining issues:". Prefix each bullet with [regression], [pre-existing], [environment], [needs-approval] or [needs-decision] when applicable.
          Audit the final report's top-level integers `critical_issues: <N>` and `high_issues: <N>`, including zeros. Report completion only on a verified pass with zero critical findings.
        runner: claude
        model: claude-opus-5-5
        effort: xhigh
        retryCondition: critical_issues > 0
    - metadata:
        phaseId: claude-speckit-implement
        name: Spec-kit Implement (Claude)
        version: 1
      spec:
        instruction: |-
          /speckit-implement
          Set aside hand-offs and blocked tasks before implementation. If a required checklist still needs approval, report the blocker without waiting and leave its marks unchanged.

          Hand-off tasks qualify only in these three cases.
          - marker: its own line in tasks.md carries the token USER-RUN outside inline code. A line that only quotes the token in inline code is not marked.
          - approval: its own line names a person's approval as the condition. Review, test results and other conditions do not count.
          - person-only last step: the only remaining step is pushing, opening or merging a pull request, watching CI, or deploying outside this repository. A task with any implementation step still undone is pending.
          Difficulty and fixable failures never make a task a hand-off or a blocker. Do not attempt a hand-off task, do not mark it complete, and do not add, remove or edit any marker or approval wording on any task line.

          Resolve conflicts in order of constitution, spec.md, plan.md, research.md/data-model.md/contracts/, and tasks.md. Correct lower sources where authorized. Choose the conventional lowest-risk option where they are silent. Project rules outrank this authority.
          Decide alone only what is reversible inside this repository and leaves secrets, external systems and production data untouched. Never weaken a security or privacy property, edit the constitution, delete or reinterpret a requirement in spec.md, or change the expected outcome of a test that already exists on develop.
          Record each choice in <feature_dir>/decisions.md under "## D-<n>: <title>" with "Status: decided", "Question:", "Chosen:", "Reversal:" and "Tasks:".

          Blocked tasks. For equal-rank conflicts, missing information or choices outside your authority, record "Status: needs-maintainer" with the question, options, recommendation and affected task IDs. A task that depends on a blocked task is blocked too. Leave the task unchecked in tasks.md and do not attempt it again in a later iteration until resolved. Treat a repeated failure with the same maintainer blocker the same way.

          Report completion when 0 tasks are pending, 0 spec gaps remain and 0 tasks are blocked, even when hand-off tasks remain. Otherwise list pending tasks, known spec or plan gaps, and blockers with decision IDs and questions under "Remaining issues:". Prefix each bullet with [regression], [pre-existing], [environment], [needs-approval] or [needs-decision] when applicable.
          List open hand-offs separately under "Hand-off tasks (for the user):" as `- <task id> (<basis>): <task text>`, before the audit block. With none open, omit that heading.
          Audit `pending_tasks: <N>`, `spec_gaps: <N>`, `blocked_tasks: <N>` and `user_run_tasks: <N>` as top-level integers, including zeros. `pending_tasks` excludes blocked and hand-off tasks. `user_run_tasks` equals the number of listed hand-offs.
        model: claude-sonnet-5-5
        runner: claude
        hostVerification: exit-code
        effort: xhigh
        retryCondition: pending_tasks > 0
    - metadata:
        phaseId: codex-speckit-implement
        name: Spec-kit Implement (Codex)
        version: 1
      spec:
