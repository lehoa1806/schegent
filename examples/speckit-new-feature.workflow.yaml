          Audit the top-level integer `converged: 1` only on successful convergence with no blockers. Otherwise audit `converged: 0` and list task IDs or blockers under "Remaining issues:". Prefix each bullet with [regression], [pre-existing], [environment], [needs-approval] or [needs-decision] when applicable.
        runner: codex
