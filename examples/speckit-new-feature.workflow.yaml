          List open hand-offs separately under "Hand-off tasks (for the user):" as `- <task id> (<basis>): <task text>`, before the audit block. With none open, omit that heading.
          Audit `pending_tasks: <N>`, `spec_gaps: <N>`, `blocked_tasks: <N>` and `user_run_tasks: <N>` as top-level integers, including zeros. `pending_tasks` excludes blocked and hand-off tasks. `user_run_tasks` equals the number of listed hand-offs.
