    - metadata:
        phaseId: claude-speckit-converge
        name: Spec-kit Converge (Claude)
        version: 1
      spec:
        instruction: |-
          /speckit-converge
          On retries, complete and verify actionable tasks from earlier convergence passes before running the check. Leave hand-offs and tasks awaiting approval or a decision open. Reuse open tasks for gaps they already cover.
          Audit the top-level integer `converged: 1` only on successful convergence with no blockers. Otherwise audit `converged: 0` and list task IDs or blockers under "Remaining issues:". Prefix each bullet with [regression], [pre-existing], [environment], [needs-approval] or [needs-decision] when applicable.
        runner: claude
        hostVerification: exit-code
        model: claude-sonnet-5-5
        effort: high
        retryCondition: converged != 1
        onRetryCap: fail
    - metadata:
        phaseId: codex-speckit-converge
        name: Spec-kit Converge (Codex)
        version: 1
      spec:
        instruction: |-
          /speckit-converge
