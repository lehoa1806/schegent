    - metadata:
        phaseId: claude-code-review
        name: Code Review (Claude)
        version: 1
      spec:
        instruction: |-
          Start with "Review scope:" and summarize the scope supplied by Schegent.
          Fix confirmed correctness findings in the Claude Code review reports. Verify affected behavior with focused repository checks.
          List unresolved findings under "Remaining issues:" with file, line and impact. Prefix each bullet with [regression], [pre-existing], [environment], [needs-approval] or [needs-decision] when applicable.
          Audit `code_review_findings: <N>` as the top-level integer count of confirmed findings still open. Emit `code_review_verified: 1` only after a complete review with zero open findings. Otherwise use 0.
        model: claude-opus-5-5
        runner: claude
        nativeReview: code
        hostVerification: exit-code
        effort: high
        retryCondition: code_review_findings > 0 or code_review_verified != 1
        onRetryCap: fail
    - metadata:
        phaseId: codex-code-review
        name: Code Review (Codex)
        version: 1
      spec:
        instruction: |-
          Start with "Review scope:" and summarize the scope supplied by Schegent.
          Fix confirmed correctness findings in the Codex review reports. Run the relevant repository checks against the patch.
          List unresolved findings under "Remaining issues:" with file, line and impact. Prefix each bullet with [regression], [pre-existing], [environment], [needs-approval] or [needs-decision] when applicable.
          Audit `code_review_findings: <N>` as the top-level integer count of confirmed findings still open. Emit `code_review_verified: 1` only after a complete review with zero open findings. Otherwise use 0.
