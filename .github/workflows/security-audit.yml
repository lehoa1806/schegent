name: Security audit

# Feature 056 Track 6 (FR-029, T042) — dependency hygiene workflow.
#
# Runs `npm audit --audit-level=low` against both `package-lock.json`
# (root) and `webview-ui/package-lock.json` on a weekly cadence plus on
# any manual dispatch. Findings surface as workflow-summary annotations;
# the workflow does NOT auto-fix or commit — operators triage in a
# compatibility-safe batch and open a PR.

on:
  schedule:
    # Mondays 03:00 UTC — out of business hours globally.
    - cron: '0 3 * * 1'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: security-audit-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  audit:
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      # `npm audit` reads the lockfile; no install needed. We
      # deliberately skip `npm ci` to avoid touching node_modules
      # for an audit-only job — `npm audit` consumes the lockfile
      # directly and is faster + safer this way.
      - name: Audit root (low+ severity)
        run: npm audit --audit-level=low

      - name: Audit webview-ui (low+ severity)
        working-directory: webview-ui
        run: npm audit --audit-level=low

      - name: Summary
        run: |
          {
            echo "## Security audit run"
            echo "Date: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "If either audit reported findings, triage in a compatibility-safe"
            echo "dependency-refresh batch (root Vite/Vitest/esbuild chain;"
            echo "webview Svelte/devalue/Vite/esbuild chain). Avoid"
            echo "\`npm audit fix --force\` unless the breaking upgrade plan is explicit."
          } >> "$GITHUB_STEP_SUMMARY"
