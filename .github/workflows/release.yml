name: Release package

on:
  push:
    tags: ['v*']
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest

    # Feature 113 (FR-007 to FR-010). The workflow default above stays
    # `contents: read`. A job-level block *replaces* that default rather than
    # extending it, so `contents: read` is restated here — dropping it would
    # leave the checkout without read access.
    #
    #   contents: write     — `gh release create` at the end of this job, only
    #   id-token: write     — the OIDC identity the attestation is signed under
    #   attestations: write — writing the provenance statement itself
    #
    # Three capabilities, one job, nothing else in the file widened.
    permissions:
      contents: write
      id-token: write
      attestations: write
      # FR-R3-060 — reading this commit's `full-gate.yml` runs. Read-only, and
      # the narrowest scope that can answer "did the full gate pass here".
      actions: read

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # FR-R3-060 (M-09 / R-13) — the full gate must have run green on THIS
      # commit. Before this step, `verify:all` + build + smoke + integration ran
      # at the tag while the eval / e2e / perf / visual / full-coverage gate was a
      # sentence in RELEASE.md, so a tag could publish with signed provenance over
      # an artifact whose full gate ran on a different commit or not at all.
      #
      # Tag runs only. A `workflow_dispatch` deliberately creates no release, so
      # requiring release evidence from it would block the dry-run this file
      # documents as the way to check a commit before tagging.
      #
      # Placed before `npm ci` so a missing gate costs seconds, matching the
      # tag/version parity check below.
      - name: Require a green full gate at this exact commit
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.sha }}
        run: node scripts/require-full-gate.mjs

      # Feature 113 (FR-011 to FR-017). The trigger is `tags: ['v*']` and nothing
      # compared the tag to the manifest, so a `v0.3.0` tag on a commit declaring
      # 0.2.0 produced a `schegent-0.2.0.vsix` under it and no step noticed. Not
      # hypothetical: when this landed the manifest was already ahead of the only
      # tag in the repository.
      #
      # Before `npm ci` so a mismatch costs seconds instead of the full chain, and
      # after `setup-node` so the `node` it reads with is the one `.nvmrc` names.
      #
      # TAG_NAME arrives through the environment. `${{ }}` substitution happens
      # before the shell parses the line, so an interpolated ref name would be
      # code rather than data. `GITHUB_REF_TYPE` needs no interpolation at all —
      # the runner exports it.
      - name: Check the tag matches the manifest version
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if [ "$GITHUB_REF_TYPE" != tag ]; then
            echo "ref is a $GITHUB_REF_TYPE rather than a tag:" \
              "skipping tag/version parity and the durable release"
            exit 0
          fi
          manifest="$(node -p 'require("./package.json").version')"
          tagged="${TAG_NAME#v}"
          if [ "$tagged" != "$manifest" ]; then
            echo "::error::tag $TAG_NAME declares version $tagged," \
              "package.json declares $manifest." \
              "Commit the version bump before tagging."
            exit 1
          fi
          echo "tag $TAG_NAME matches package.json version $manifest"

      - run: npm ci --ignore-scripts
      - run: npm --prefix webview-ui ci --ignore-scripts
      - run: npm run verify:all
      - run: npm run build

      # Feature 098 (REL-03). The tag build publishes the artifact, so it must
      # be at least as strict as the PR gate that never sees a tag. Both of
      # these ran on `pr.yml`/`ci.yml` and on the weekly `full-gate.yml`, but
      # not here — a release could ship content the packaging pin forbids, or
      # an activation failure the unit suites cannot observe, because nothing
      # between the last CI run and the tag re-checked either.
      #
      # `package:smoke` packages into a temp dir and asserts the VSIX entry
      # allowlist and size budget; it does not produce the released file, so it
      # is safe to run ahead of `npm run package` below.
      - name: Package smoke
        run: npm run package:smoke

      # Real VS Code via @vscode/test-electron; the runner is headless, so it
      # needs a display server.
      - name: Integration tests
        run: xvfb-run -a npm run test:integration

      - run: npm run package

      # Feature 113 (FR-020, FR-047). Five steps below need the released archive:
      # the policy assertion, the checksums, the attestation subject, the 90-day
      # bundle, and the release upload. Five globs would be five chances for one
      # step to act on an archive another step never saw, so the path is resolved
      # once, here, and every consumer reads this output.
      - name: Resolve the released package
        id: released
        run: |
          shopt -s nullglob
          archives=(*.vsix)
          if [ "${#archives[@]}" -ne 1 ]; then
            echo "::error::expected exactly one .vsix in the workspace root," \
              "found ${#archives[@]}"
            exit 1
          fi
          echo "vsix=${archives[0]}" >> "$GITHUB_OUTPUT"

      # Feature 113 (FR-018, FR-019, FR-022). `package:smoke` above asserted the
      # allowlist and the size budgets over a temp-dir package built from the same
      # `dist/` — the right order, and deliberately not the file that ships. This
      # asserts the bytes that do. Same checker, same allowlist, because
      # `scripts/check-vsix-smoke.mjs` already takes a path when invoked directly:
      # there is no second definition of the policy here to drift from the first.
      - name: Released package policy
        env:
          VSIX: ${{ steps.released.outputs.vsix }}
        run: node scripts/check-vsix-smoke.mjs "$VSIX"

      - name: Generate CycloneDX SBOM
        run: npm sbom --sbom-format cyclonedx > schegent-sbom.cdx.json

      - name: Generate checksums
        env:
          VSIX: ${{ steps.released.outputs.vsix }}
        run: sha256sum "$VSIX" schegent-sbom.cdx.json > SHA256SUMS

      # Feature 113 (FR-001 to FR-006). `SHA256SUMS` is generated and uploaded by
      # this same unsigned job, so checking a download against it establishes that
      # the bytes arrived intact and nothing about where they came from: anyone able
      # to substitute the artifact can substitute the digest file beside it. The
      # attestation binds these digests to this repository, this workflow file and
      # this commit, and `gh attestation verify` checks it with no key material on
      # either side — the signing identity is this workflow's OIDC token.
      #
      # After the policy assertion, never before. An attestation over an archive
      # this project's own gate would refuse is worse than no attestation, because
      # it is what an operator trusts *instead of* reading the archive.
      #
      # `SHA256SUMS` is deliberately not a subject: its content is the digests of
      # the two files below, both attested, so verifying the subjects directly is
      # strictly stronger than verifying a manifest of them. Attesting the manifest
      # would advertise the weaker check as the supported one.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            ${{ steps.released.outputs.vsix }}
            schegent-sbom.cdx.json

      # Feature 113 (FR-024, FR-047). Retained as it was, `if-no-files-found:
      # error` included, with one change: the archive comes from the resolution
      # above rather than a `*.vsix` glob of this step's own. Identical files
      # either way — the resolve step already failed the job unless exactly one
      # archive exists — but it leaves a single rule with no exception to
      # re-derive: after packaging, every step naming the released archive names
      # the one path that was checked.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: schegent-release-artifacts
          path: |
            ${{ steps.released.outputs.vsix }}
            schegent-sbom.cdx.json
            SHA256SUMS
          if-no-files-found: error
          retention-days: 90

      # Feature 113 (FR-023 to FR-027, FR-044 to FR-046). The upload above expires
      # in 90 days, which would leave the attestation pointing at a file an operator
      # can no longer fetch. A GitHub Release outlives the run. `gh` is preinstalled
      # on GitHub-hosted runners, so durability costs no new action pin and no new
      # third-party publisher — this file still trusts exactly one.
      #
      # Last on purpose: a failed attestation must not leave a published release
      # behind. Tag runs only; a dispatch has no ref to anchor to.
      #
      # This is a durable home for the artifact, not a distribution channel. The
      # marketplace publish step stays manual, per RELEASE.md.
      - name: Publish the GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
          VSIX: ${{ steps.released.outputs.vsix }}
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "::error::a release already exists for $TAG_NAME." \
              "RELEASE.md says do not retag: delete that release deliberately," \
              "or cut a new version."
            exit 1
          fi
          # Derived from the tag rather than written down, so it drops itself at
          # v1.0.0 instead of needing an edit nobody will remember.
          prerelease=()
          case "$TAG_NAME" in v0.*) prerelease=(--prerelease) ;; esac
          notes="$RUNNER_TEMP/release-body.md"
          {
            printf 'Built by `.github/workflows/release.yml`. Verify the package before installing it:\n\n'
            printf '```\ngh attestation verify %s \\\n  --repo %s \\\n  --signer-workflow %s/.github/workflows/release.yml\n```\n\n' \
              "$VSIX" "$REPOSITORY" "$REPOSITORY"
            printf 'A `.vsix` built outside this workflow is expected to fail that command.\n\n'
            printf 'Operator-visible changes: `docs/operations/release-notes.md`.\n'
          } > "$notes"
          gh release create "$TAG_NAME" \
            --verify-tag \
            --title "$TAG_NAME" \
            --notes-file "$notes" \
            "${prerelease[@]}" \
            "$VSIX" schegent-sbom.cdx.json SHA256SUMS
