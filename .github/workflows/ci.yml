name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  full:
    name: full CI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      # Skip third-party npm lifecycle scripts on install to reduce
      # supply-chain blast radius. The root `postinstall` (which
      # delegates to `webview-ui`) is skipped here too; we re-run the
      # webview install explicitly with the same flag so neither tree
      # executes arbitrary scripts on `npm ci`.
      - name: Install root dependencies (no scripts)
        run: npm ci --ignore-scripts

      - name: Install webview-ui dependencies (no scripts)
        run: npm --prefix webview-ui ci --ignore-scripts

      - name: Explicit test typecheck gate
        run: npm run typecheck:tests

      - name: Consolidated verification
        run: npm run verify:all

      - name: Deterministic backend evaluations
        run: npm run test:evals

      # Coverage gate runs only on Linux to avoid 3x the cost. Floor
      # is set in vitest.config.ts (statements/branches/functions/lines).
      - name: Coverage gate (Linux only)
        if: runner.os == 'Linux'
        run: npm run test:coverage

      - name: E2E tests
        run: npm run test:e2e

      - name: Perf (blocking budgets)
        run: npm run test:perf

      - name: Build
        run: npm run build

      - name: Install visual-test browser (Linux only)
        if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium

      - name: Browser visual regression (Linux only)
        if: runner.os == 'Linux'
        run: npm run test:visual

      - name: Package smoke
        run: npm run package:smoke

      - name: Upload visual diffs on failure (Linux only)
        if: failure() && runner.os == 'Linux'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-visual-regression-artifacts
          path: tests/visual/.artifacts/**
          if-no-files-found: ignore
          retention-days: 14

      # Integration tests run real VS Code via @vscode/test-electron.
      # On Linux we need xvfb; macOS/Windows have native display servers.
      - name: Integration tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:integration

      - name: Integration tests (macOS / Windows)
        if: runner.os != 'Linux'
        run: npm run test:integration

  # `engines.node` declares `^22 || ^24`, but every job above installs the
  # single version `.nvmrc` pins (24.19.0). This job is what keeps the `^22`
  # floor from being a claim no gate ever checks — and the floor is the half
  # more likely to break, because code written on 24 is what quietly reaches
  # for an API 22 does not have. It runs `verify:all` only, the cheap and
  # platform-independent leg, because what is in question is the language
  # runtime and not the OS matrix the jobs above already cover. Keep this
  # pinned to the low end of `engines.node` and `.nvmrc` to the high end, so
  # the two always name different majors.
  cross-major:
    name: cross-major (node 22 floor, ubuntu)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.2'
          cache: 'npm'

      - name: Install root dependencies (no scripts)
        run: npm ci --ignore-scripts

      - name: Install webview-ui dependencies (no scripts)
        run: npm --prefix webview-ui ci --ignore-scripts

      - name: Explicit test typecheck gate
        run: npm run typecheck:tests

      - name: Consolidated verification
        run: npm run verify:all
