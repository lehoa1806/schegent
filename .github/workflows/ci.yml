name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  full:
    name: full CI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      # Skip third-party npm lifecycle scripts on install to reduce
      # supply-chain blast radius. The root `postinstall` (which
      # delegates to `webview-ui`) is skipped here too; we re-run the
      # webview install explicitly with the same flag so neither tree
      # executes arbitrary scripts on `npm ci`.
      - name: Install root dependencies (no scripts)
        run: npm ci --ignore-scripts

      - name: Install webview-ui dependencies (no scripts)
        run: npm --prefix webview-ui ci --ignore-scripts

      - name: Typecheck (host)
        run: npm run typecheck

      - name: Typecheck (webview)
        run: npm run typecheck:webview

      - name: Typecheck (tests)
        run: npm run typecheck:tests

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Deterministic backend evaluations
        run: npm run test:evals

      # Coverage gate runs only on Linux to avoid 3x the cost. Floor
      # is set in vitest.config.ts (statements/branches/functions/lines).
      - name: Coverage gate (Linux only)
        if: runner.os == 'Linux'
        run: npm run test:coverage

      - name: E2E tests
        run: npm run test:e2e

      - name: Perf (blocking budgets)
        run: npm run test:perf

      - name: Build
        run: npm run build

      - name: Install visual-test browser (Linux only)
        if: runner.os == 'Linux'
        run: npx playwright install chromium

      - name: Browser visual regression (Linux only)
        if: runner.os == 'Linux'
        run: npm run test:visual

      - name: Package smoke
        run: npm run package:smoke

      - name: Upload visual diffs on failure (Linux only)
        if: failure() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: ci-visual-regression-artifacts
          path: tests/visual/.artifacts/**
          if-no-files-found: ignore
          retention-days: 14

      # Integration tests run real VS Code via @vscode/test-electron.
      # On Linux we need xvfb; macOS/Windows have native display servers.
      - name: Integration tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:integration

      - name: Integration tests (macOS / Windows)
        if: runner.os != 'Linux'
        run: npm run test:integration
