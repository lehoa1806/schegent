name: Full gate

# Feature 056 Track 6 (FR-030, T049) — required scheduled / manual full
# gate.
#
# The fast PR gate (.github/workflows/pr.yml) runs all typechecks + lint +
# test + build + exact package smoke on every PR. This workflow adds the heavier
# integration-host and deterministic E2E coverage on a weekly cadence
# plus on demand. Required green before cutting a release per
# RELEASE.md.
#
# FR-R3-074 — release.yml binds to this file by exact SHA
# (scripts/require-full-gate.mjs) and its requirement comment names the
# eval / e2e / perf / visual / full-coverage checks. Every named check must be
# an executed `npm run` step here; tests/unit/build/full-gate-parity.test.ts
# fails the build when one is removed or renamed.

on:
  schedule:
    # Mondays 06:00 UTC — comfortably after the security-audit run at
    # 03:00 UTC so a dep-refresh PR can race through pr.yml first.
    - cron: '0 6 * * 1'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: full-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  typecheck-host:
    name: typecheck (host)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: 'npm'
      # Skip third-party npm lifecycle scripts on install to reduce
      # supply-chain blast radius. We re-run the webview install
      # explicitly with the same flag so neither tree executes
      # arbitrary scripts on `npm ci`.
      - run: npm ci --ignore-scripts
      - run: npm --prefix webview-ui ci --ignore-scripts
      - run: npm run typecheck

  typecheck-webview:
    name: typecheck (webview)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: 'npm'
      # Skip third-party npm lifecycle scripts on install to reduce
      # supply-chain blast radius. We re-run the webview install
      # explicitly with the same flag so neither tree executes
      # arbitrary scripts on `npm ci`.
      - run: npm ci --ignore-scripts
      - run: npm --prefix webview-ui ci --ignore-scripts
      - run: npm run typecheck:webview

  typecheck-tests:
    name: typecheck (tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: 'npm'
      - run: npm ci --ignore-scripts
      - run: npm run typecheck:tests

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: 'npm'
      # Skip third-party npm lifecycle scripts on install to reduce
      # supply-chain blast radius. We re-run the webview install
      # explicitly with the same flag so neither tree executes
      # arbitrary scripts on `npm ci`.
      - run: npm ci --ignore-scripts
      - run: npm --prefix webview-ui ci --ignore-scripts
      - run: npm run lint
      # FR-R3-074 — the webview lint baseline must sit inside the gate the
      # release binds to, not only in the per-PR chains.
      - run: npm run lint:webview

  test:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: 'npm'
      # Skip third-party npm lifecycle scripts on install to reduce
      # supply-chain blast radius. We re-run the webview install
      # explicitly with the same flag so neither tree executes
      # arbitrary scripts on `npm ci`.
      - run: npm ci --ignore-scripts
      - run: npm --prefix webview-ui ci --ignore-scripts
      # FR-R3-074 — the release binding names a full-coverage check, so both
      # test legs run under their coverage thresholds rather than as the bare
      # suites: `test:coverage` for the host, `test:webview:coverage` for the
      # webview — the same two legs ci.yml holds per PR (`test:coverage`
      # directly, `test:webview:coverage` via `verify:all`).
      - run: npm run test:coverage
      - run: npm run test:webview:coverage
      - run: npm run test:evals

  perf:
    name: perf budgets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: 'npm'
      # FR-R3-074 — the release binding names a perf check, so the wall-clock
      # budgets run inside this gate. Host install only: vitest.perf.config.ts
      # scopes the suite to tests/perf/** against the vscode stub and touches
      # no webview code — the same shape the evidence-soak job relies on.
      - run: npm ci --ignore-scripts
      - run: npm run test:perf

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: 'npm'
      # Skip third-party npm lifecycle scripts on install to reduce
      # supply-chain blast radius. We re-run the webview install
      # explicitly with the same flag so neither tree executes
      # arbitrary scripts on `npm ci`.
      - run: npm ci --ignore-scripts
      - run: npm --prefix webview-ui ci --ignore-scripts
      - run: npm run build
      - run: npm run package:smoke

  visual:
    name: browser visual regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: 'npm'
      - run: npm ci --ignore-scripts
      - run: npm --prefix webview-ui ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run test:visual
      - name: Upload visual diffs on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: visual-regression-artifacts
          path: tests/visual/.artifacts/**
          if-no-files-found: ignore
          retention-days: 14

  e2e:
    name: deterministic E2E smoke (feature 055)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: 'npm'
      # Skip third-party npm lifecycle scripts on install to reduce
      # supply-chain blast radius. We re-run the webview install
      # explicitly with the same flag so neither tree executes
      # arbitrary scripts on `npm ci`.
      - run: npm ci --ignore-scripts
      - run: npm --prefix webview-ui ci --ignore-scripts
      - run: npm run test:e2e
      - name: Upload E2E artifacts on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-artifacts
          path: |
            tests/e2e/.artifacts/**
            vitest-report.json
          if-no-files-found: ignore
          retention-days: 14

  integration:
    name: extension-host integration smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: 'npm'
      # Skip third-party npm lifecycle scripts on install to reduce
      # supply-chain blast radius. We re-run the webview install
      # explicitly with the same flag so neither tree executes
      # arbitrary scripts on `npm ci`.
      - run: npm ci --ignore-scripts
      - run: npm --prefix webview-ui ci --ignore-scripts
      - name: Run @vscode/test-electron under Xvfb
        run: xvfb-run -a npm run test:integration
      - name: Upload integration logs on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: integration-artifacts
          path: |
            .vscode-test/**
            out/tests/integration/**
          if-no-files-found: ignore
          retention-days: 14

  evidence-soak:
    name: sustained evidence soak
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: 'npm'
      - run: npm ci --ignore-scripts
      - name: Run deterministic high-volume evidence profile
        env:
          SCHEGENT_SUSTAINED_RECORD_COUNT: '20000'
          SCHEGENT_SOAK_REPORT: tests/soak/.artifacts/sustained-evidence.json
        run: npm run test:soak
      - name: Upload soak report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sustained-evidence-report
          path: tests/soak/.artifacts/**
          if-no-files-found: error
          retention-days: 30
