name: PR

on:
  pull_request:
    branches:
      - develop
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: pr-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      # Skip third-party npm lifecycle scripts on install to reduce
      # supply-chain blast radius. The root `postinstall` (which
      # delegates to `webview-ui`) is skipped here too; we re-run the
      # webview install explicitly with the same flag so neither tree
      # executes arbitrary scripts on `npm ci`.
      - name: Install root dependencies (no scripts)
        run: npm ci --ignore-scripts

      - name: Install webview-ui dependencies (no scripts)
        run: npm --prefix webview-ui ci --ignore-scripts

      - name: Explicit test typecheck gate
        run: npm run typecheck:tests

      - name: Consolidated verification
        run: npm run verify:all

      - name: Deterministic backend evaluations
        run: npm run test:evals

      - name: Build
        run: npm run build

      - name: Install visual-test browser (Linux only)
        if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium

      - name: Browser visual regression (Linux only)
        if: runner.os == 'Linux'
        run: npm run test:visual

      - name: Package smoke
        run: npm run package:smoke

      - name: Upload visual diffs on failure (Linux only)
        if: failure() && runner.os == 'Linux'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pr-visual-regression-artifacts
          path: tests/visual/.artifacts/**
          if-no-files-found: ignore
          retention-days: 14
