name: PR

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: pr-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      # Skip third-party npm lifecycle scripts on install to reduce
      # supply-chain blast radius. The root `postinstall` (which
      # delegates to `webview-ui`) is skipped here too; we re-run the
      # webview install explicitly with the same flag so neither tree
      # executes arbitrary scripts on `npm ci`.
      - name: Install root dependencies (no scripts)
        run: npm ci --ignore-scripts

      - name: Install webview-ui dependencies (no scripts)
        run: npm --prefix webview-ui ci --ignore-scripts

      - name: Typecheck (host)
        run: npm run typecheck

      - name: Typecheck (webview)
        run: npm run typecheck:webview

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Package smoke
        run: npm run package:smoke
