# Schegent Dependabot policy — see specs/037-dependabot/spec.md
# Major-version bumps are intentionally excluded (FR-012); open manually if desired.
#
# What governs what this opens (FR-R3-178, decided 2026-10-02): a bot-proposed dependency change
# is merged into `develop` only from a commit that carries a passing `npm run gate:record` record
# naming that commit; nothing on GitHub checks it, so the rule holds only as far as the operator
# follows it.
#
# A proposal is therefore never merged as written. In the root manifest it moves a range that
# tests/lint/dependency-change-scope.test.ts pins, so the gate fails at the proposal's own head.
# Accepted proposals are applied as one commit that also moves the pin, and that commit is the
# one recorded and merged. Decision, measurement, reason, revisit condition and the steps:
# docs/operations/gate-recording.md.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps-dev)"
    labels:
      - "dependencies"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
    groups:
      vitest-toolchain:
        patterns:
          - "vitest"
        update-types:
          - "minor"
          - "patch"
      eslint:
        patterns:
          - "eslint"
          - "@typescript-eslint/*"
        update-types:
          - "minor"
          - "patch"
      typescript:
        patterns:
          - "typescript"
          - "@types/*"
        update-types:
          - "minor"
          - "patch"
      esbuild:
        patterns:
          - "esbuild"
        update-types:
          - "minor"
          - "patch"
      vscode-test:
        patterns:
          - "@vscode/test-electron"
          - "@vscode/vsce"
        update-types:
          - "minor"
          - "patch"
      prettier:
        patterns:
          - "prettier"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/webview-ui"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps-dev)"
    labels:
      - "dependencies"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
    groups:
      vite-toolchain:
        patterns:
          - "vite"
          - "@sveltejs/vite-plugin-svelte"
        update-types:
          - "minor"
          - "patch"
      svelte:
        patterns:
          - "svelte"
          - "svelte-check"
          - "@tsconfig/svelte"
        update-types:
          - "minor"
          - "patch"
      vitest-toolchain:
        patterns:
          - "vitest"
          - "@testing-library/svelte"
          - "jsdom"
        update-types:
          - "minor"
          - "patch"
      typescript:
        patterns:
          - "typescript"
        update-types:
          - "minor"
          - "patch"
